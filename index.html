---
layout: default 
---
<div class="py-4">
    <h1 class="text-2xl font-bold mb-4">Recent posts</h1>
    <ul class="space-y-4">
        {% for post in site.posts %}
        <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span class="text-sm text-gray-500">{{ post.date | date: "%Y-%m-%d" }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
